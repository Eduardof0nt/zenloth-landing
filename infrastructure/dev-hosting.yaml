AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 and CloudFront hosting with GitHub OIDC deployment identity for the Zenloth landing preview.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev]
  BucketName:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  GitHubOwner:
    Type: String
    Default: Eduardof0nt
    AllowedPattern: '^[A-Za-z0-9_.-]+$'
Mappings:
  GitHubEnvironmentNames:
    dev: { Name: dev }
    staging: { Name: staging }
    prod: { Name: prod }

Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Application
          Value: zenloth-landing
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub zenloth-landing-${Environment}-s3-oac
        Description: !Sub CloudFront-only access to Zenloth landing ${Environment} web assets.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub zenloth-landing-${Environment}-security-headers
        CustomHeadersConfig:
          Items:
            - Header: X-Robots-Tag
              Value: noindex, nofollow
              Override: true
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true

  PrivateRouteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub zenloth-landing-${Environment}-routes
      AutoPublish: true
      FunctionConfig:
        Comment: Serve public locale directory indexes; missing files retain real 404 status.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri === '/en') request.uri = '/en/index.html';
          else if (request.uri.endsWith('/')) request.uri += 'index.html';
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub Zenloth landing preview ${Environment}
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: website-bucket
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: website-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt PrivateRouteFunction.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebsiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub zenloth-${Environment}-github-landing
      Description: !Sub Exact ${Environment} web deployment identity for zenloth-landing.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Match GitHub's immutable owner/repository IDs as observed in CloudTrail.
                # Repository recreation requires an explicit review of this exact subject.
                token.actions.githubusercontent.com:sub: !Sub
                  - repo:${GitHubOwner}@3641259/zenloth-landing@1350130317:environment:${GitHubEnvironmentName}
                  - GitHubEnvironmentName: !FindInMap [GitHubEnvironmentNames, !Ref Environment, Name]
      Policies:
        - PolicyName: DeployEnvironmentLandingAssets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListOnlyDeploymentBucket
                Effect: Allow
                Action: [s3:GetBucketLocation, s3:ListBucket]
                Resource: !GetAtt WebsiteBucket.Arn
              - Sid: PublishOnlyDeploymentObjects
                Effect: Allow
                Action: [s3:DeleteObject, s3:GetObject, s3:PutObject]
                Resource: !Sub ${WebsiteBucket.Arn}/*
              - Sid: InvalidateOnlyThisDistribution
                Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetDistribution, cloudfront:GetInvalidation]
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
      Tags:
        - Key: Application
          Value: zenloth-landing
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  BucketName:
    Value: !Ref WebsiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  DeploymentRoleArn:
    Value: !GetAtt DeploymentRole.Arn
